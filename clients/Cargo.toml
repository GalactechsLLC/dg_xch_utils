[package]
name = "dg_xch_clients"
description = "RPC and Websocket Clients the Chia Blockchain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
zeroize = "1.9.0"
async-trait = "0.1.89"
blst = { version = "0.3.16", features = ["portable"] }
dg_xch_core = {path = "../core", version = "3.0.0", default-features = false, features = ["bls"]}
dg_xch_keys = {path = "../keys", version="3.0.0"}
dg_xch_pos = {path = "../proof_of_space", version="3.0.0"}
dg_xch_serialize = {path = "../serialize", version="3.0.0"}
futures-util = "0.3.32"
hex = "0.4.3"
log = "0.4.29"
prometheus = {version="0.14.0", features=["protobuf"], optional = true}
reqwest = {version="0.12.24", default-features = false, features = ["rustls-tls", "json"] }
rustls = {version = "0.23.45" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = {version = "1.50.0", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}
tokio-tungstenite = {version = "0.28.0", features = ["rustls", "rustls-tls-webpki-roots"] }
urlencoding = "2.1.3"
uuid = {version="1.21.0", features=["v4"]}

[features]
metrics = ["dep:prometheus", "dg_xch_core/metrics"]
default = []
