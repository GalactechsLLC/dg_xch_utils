[package]
name = "dg_xch_labrador"
description = "Isolated experimental LaBRADOR worker for Falcon development chains"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# The approved source files are public; the private research record stays local.
exclude = ["native/sources.private.json"]

[dependencies]
libc = { version = "0.2.191", optional = true }

fn-dsa-comm = { version = "=0.4.0", optional = true }

[dev-dependencies]
fn-dsa = "=0.4.0"

[build-dependencies]
cc = "1.10.0"

[features]
backend = ["dep:libc", "dep:fn-dsa-comm"]

[[bin]]
name = "dg_xch_labrador_worker"
path = "src/worker.rs"
required-features = ["backend"]
