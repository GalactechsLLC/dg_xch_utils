[package]
name = "dg_xch_introducer"
description = "Bounded Chia-compatible peer discovery service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
dg_xch_core = { path = "../core", default-features = false }
dg_xch_serialize = { path = "../serialize" }
dg_xch_servers = { path = "../servers" }
futures-util = "0.3.32"
rustls = "0.23.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
