[workspace]
resolver = "3"
# The fuzz crate needs nightly (libfuzzer); keep it out of normal workspace builds.
exclude = ["fuzz"]
members = [
    "cli",
    "clients",
    "core",
    "full-node",
    "gui/src-tauri",
    "keys",
    "logging",
    "macros",
    "node",
    "p2p",
    "parser_macro",
    "proof_of_space",
    "puzzles",
    "serialize",
    "servers",
    "simulator",
    "stores",
    "tools",
    "vdf",
    "weight-proof"
]

[workspace.package]
version = "3.0.0"
edition = "2024"
authors = ["James Hoerr jhoerr@galactechs.com"]
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils"

[profile.bench]
debug = true
strip = "debuginfo"

[profile.release-perf]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = 1
strip = "none"
