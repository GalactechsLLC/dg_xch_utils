[package]
name = "dg_logger"
description = "Druid Garden Logging Library"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
bus = "2.4.1"
colored = { version = "3.1.1", optional = true}
ctrlc = "3.5.2"
log = { version = "0.4.29"}
parking_lot = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
time = { version = "0.3.47", features = ["local-offset", "serde","macros","parsing","formatting"]}

[features]
default = ["color"]
color = ["colored"]
