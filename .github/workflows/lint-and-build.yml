on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Run Format
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -- -Dwarnings
  build:
    name: Build
    permissions:
      contents: read
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Windows MSVC is unsupported: the VDF crate depends on gmp-mpfr-sys for
        # consensus-correct discriminant primality (chiavdf's Baillie-PSW — a different
        # primality test would select a different prime and fork consensus), and
        # gmp-mpfr-sys refuses to link on the MSVC target. The node targets Linux
        # (server + aarch64 Raspberry Pi) and macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Build library
        run: cargo build --release
  audit:
    name: Dependency Audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails the build on any RustSec advisory against the committed Cargo.lock (SSDF PW.7 / A03:2025).
      - name: Run cargo audit
        run: cargo audit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit frontend dependencies
        working-directory: gui
        run: npm audit --package-lock-only --ignore-scripts
