on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libssl-dev \
            libxkbcommon-dev \
            libwayland-dev
      - name: Run Format
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  build:
    name: Build
    permissions:
      contents: read
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Windows MSVC is unsupported: the VDF crate depends on gmp-mpfr-sys for
        # consensus-correct discriminant primality (chiavdf's Baillie-PSW — a different
        # primality test would select a different prime and fork consensus), and
        # gmp-mpfr-sys refuses to link on the MSVC target. The node targets Linux
        # (server + aarch64 Raspberry Pi) and macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libssl-dev \
            libxkbcommon-dev \
            libwayland-dev
      - name: Build library
        run: cargo build --release
  audit:
    name: Dependency Audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails the build on any RustSec advisory against the committed Cargo.lock (SSDF PW.7 / A03:2025).
      - name: Run cargo audit
        run: cargo audit
  native-desktop:
    name: Native Desktop
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libssl-dev libxkbcommon-dev libwayland-dev xvfb libvulkan1 mesa-vulkan-drivers
      - name: Build unified native desktop
        run: cargo build -p dg_xch_cli --no-default-features --features desktop,vulkan --locked
      - name: Test launcher initialization
        run: cargo test -p dg_xch_cli --no-default-features --features desktop,vulkan --test setup_cli --locked
      - name: Test desktop and wallet
        run: cargo test -p dg_xch_gui -p dg_xch_wallet -p dg_xch_farmer --locked
      - name: Render every page on Linux
        if: runner.os == 'Linux'
        run: timeout 60s xvfb-run -a target/debug/dgx gui --smoke-test
        env:
          WINIT_UNIX_BACKEND: x11
          WGPU_BACKEND: vulkan
      - name: Render every page on macOS
        if: runner.os == 'macOS'
        run: python3 -c 'import subprocess; subprocess.run(["target/debug/dgx", "gui", "--smoke-test"], check=True, timeout=60)'
      - name: Render every page on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath target/debug/dgx.exe -ArgumentList 'gui','--smoke-test' -PassThru
          if (-not $app.WaitForExit(60000)) {
            Stop-Process -Id $app.Id -Force
            throw 'Native desktop smoke test timed out'
          }
          if ($app.ExitCode -ne 0) { throw "Native desktop exited with $($app.ExitCode)" }
