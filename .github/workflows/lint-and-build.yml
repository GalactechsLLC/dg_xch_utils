on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Bound concurrent debug RSA key generation on shared runners.
  RUST_TEST_THREADS: 2

jobs:
  signature-profiles:
    name: Product build (${{ matrix.profile }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: bls
            crypto: ""
            features: hint,timelord,desktop,vulkan
          - profile: post-quantum
            crypto: labrador
            features: hint,timelord,desktop,vulkan,labrador
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-native-deps
      - name: Build products and stack utilities
        run: >-
          cargo build --release --locked -p dg_xch_cli -p dg_xch_dev_tools
          --no-default-features --features '${{ matrix.features }}'
          --bin dgx --bin dg_xch_stack_init --bin dg_xch_stack_plot
          --bin dg_xch_stack_check --bin dg_xch_stack_pool
      - name: Build aggregation worker
        if: matrix.profile == 'post-quantum'
        run: cargo build --release --locked -p dg_xch_labrador --features backend --bin dg_xch_labrador_worker
      - name: Test profile isolation and wallet and pool behavior
        run: |
          cargo test --locked -p dg_xch_core --lib branding::tests --features '${{ matrix.crypto }}'
          cargo test --locked -p dg_xch_core --test clvm_runtime_gaps --test flag_ladder --features '${{ matrix.crypto }}'
          cargo test --locked -p dg_xch_gui -p dg_xch_farmer --lib --features '${{ matrix.crypto }}'
          cargo test --locked -p dg_xch_wallet --lib --test standard_wallet --test falcon_wallet --features '${{ matrix.crypto }}'
          cargo test --locked -p dg_xch_pool --lib --features '${{ matrix.crypto }}'
          cargo test --locked -p dg_xch_dev_tools --test stack_profiles --features '${{ matrix.crypto }}'
      - name: Package executable products
        shell: bash
        run: |
          binaries=(dgx dg_xch_stack_init dg_xch_stack_plot dg_xch_stack_check dg_xch_stack_pool)
          if [[ '${{ matrix.profile }}' == 'post-quantum' ]]; then
            binaries+=(dg_xch_labrador_worker)
          fi
          tar -czf 'dgx-linux-${{ matrix.profile }}.tar.gz' -C target/release "${binaries[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: dgx-linux-${{ matrix.profile }}
          path: dgx-linux-${{ matrix.profile }}.tar.gz
          if-no-files-found: error
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - uses: ./.github/actions/setup-native-deps
      - name: Run Format
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  build:
    name: Build
    permissions:
      contents: read
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Windows MSVC is unsupported: the VDF crate depends on gmp-mpfr-sys for
        # consensus-correct discriminant primality (chiavdf's Baillie-PSW — a different
        # primality test would select a different prime and fork consensus), and
        # gmp-mpfr-sys refuses to link on the MSVC target. The node targets Linux
        # (server + aarch64 Raspberry Pi) and macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - uses: ./.github/actions/setup-native-deps
      - uses: dtolnay/rust-toolchain@stable
      - name: Build library
        run: cargo build --workspace --release --locked
  audit:
    name: Dependency Audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Audit both independently resolved dependency graphs without vulnerability suppressions.
      - name: Run cargo audit
        run: |
          cargo audit
          cargo audit --file plotter/cuda/Cargo.lock
  native-desktop:
    name: Native Desktop
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            shell: bash
          - os: macos-latest
            toolchain: stable
            shell: bash
          # Wallet consensus validation requires GMP, which rejects Windows MSVC.
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install Windows GNU build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            diffutils
            m4
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
      - uses: ./.github/actions/setup-native-deps
      - name: Build unified native desktop
        run: cargo build -p dg_xch_cli --no-default-features --features desktop,vulkan --locked
      - name: Check post-quantum desktop feature wiring
        run: cargo check -p dg_xch_cli --no-default-features --features desktop,vulkan,labrador --locked
      - name: Test launcher initialization
        run: cargo test -p dg_xch_cli --no-default-features --features desktop,vulkan --test setup_cli --locked
      - name: Test desktop and wallet
        run: cargo test -p dg_xch_gui -p dg_xch_wallet -p dg_xch_farmer --locked
      - name: Test post-quantum desktop
        run: cargo test -p dg_xch_gui --lib --features labrador --locked
      - name: Test pooling protocols and puzzle compatibility
        run: cargo test -p dg_xch_pool -p dg_xch_puzzles --locked
      - name: Build post-quantum desktop for runtime checks
        run: cargo build -p dg_xch_cli --no-default-features --features desktop,vulkan,labrador --locked
      - name: Render every page on Linux
        if: runner.os == 'Linux'
        run: timeout 60s xvfb-run -a target/debug/dgx gui --smoke-test
        env:
          WINIT_UNIX_BACKEND: x11
          WGPU_BACKEND: vulkan
      - name: Render every page on macOS
        if: runner.os == 'macOS'
        run: python3 -c 'import subprocess; subprocess.run(["target/debug/dgx", "gui", "--smoke-test"], check=True, timeout=60)'
      - name: Render every page on Windows
        if: runner.os == 'Windows'
        run: timeout 60s target/debug/dgx.exe gui --smoke-test
      - name: Render both profiles on headless Wayland
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install --yes weston
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --renderer=pixman --socket=wayland-test --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          compositor=$!
          trap 'kill "$compositor"; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          for attempt in $(seq 1 50); do
            test -S "$XDG_RUNTIME_DIR/wayland-test" && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/wayland-test"
          unset DISPLAY WINIT_UNIX_BACKEND
          export WAYLAND_DISPLAY=wayland-test WGPU_BACKEND=vulkan
          timeout 60s target/debug/dgx gui --smoke-test
          DGX_GUI_SMOKE_PROFILE=falcon timeout 60s target/debug/dgx gui --smoke-test
      - name: Render Falcon pages on Linux
        if: runner.os == 'Linux'
        run: timeout 60s xvfb-run -a target/debug/dgx gui --smoke-test
        env:
          DGX_GUI_SMOKE_PROFILE: falcon
          WINIT_UNIX_BACKEND: x11
          WGPU_BACKEND: vulkan
      - name: Render Falcon pages on macOS
        if: runner.os == 'macOS'
        run: python3 -c 'import subprocess; subprocess.run(["target/debug/dgx", "gui", "--smoke-test"], check=True, timeout=60)'
        env:
          DGX_GUI_SMOKE_PROFILE: falcon
      - name: Render Falcon pages on Windows
        if: runner.os == 'Windows'
        run: timeout 60s target/debug/dgx.exe gui --smoke-test
        env:
          DGX_GUI_SMOKE_PROFILE: falcon

  rocksdb:
    name: RocksDB full node
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - uses: ./.github/actions/setup-native-deps
      - name: Install RocksDB binding dependencies
        run: sudo apt-get install --yes clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check full-node CLI
        run: cargo check --locked -p dg_xch_cli --no-default-features --features rocksdb,hint
      - name: Lint RocksDB storage
        run: cargo clippy --locked -p dg_xch_stores --all-targets --features rocksdb,hint -- -D warnings
      - name: Test validator storage
        run: cargo test --locked -p dg_xch_stores --features rocksdb
      - name: Test wallet service storage
        run: cargo test --locked -p dg_xch_stores --features rocksdb,hint
      - name: Test full-node sync, RPC, and wallet delivery
        run: cargo test --locked -p dg_full_node --features rocksdb,hint --test integration
