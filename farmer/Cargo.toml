[package]
name = "dg_xch_farmer"
description = "Integrated native farmer and harvester"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.upstream]
repository = "https://github.com/GalactechsLLC/dg_fast_farmer"
revision = "270d44e1d885bd2d21ed658345042c954abfdcdc"

[features]
falcon = ["dg_xch_core/falcon"]
vulkan = ["dg_xch_plotter/vulkan", "dg_xch_pos/vulkan"]
cuda = ["dg_xch_pos/cuda"]

[dependencies]
async-trait = "0.1.89"
blst = "0.3.16"
dg_xch_clients = { path = "../clients", features = ["metrics"] }
dg_xch_core = { path = "../core", default-features = false, features = ["metrics", "bls"] }
dg_xch_keys = { path = "../keys" }
dg_xch_pos = { path = "../proof_of_space" }
dg_xch_plotter = { path = "../plotter" }
dg_xch_puzzles = { path = "../puzzles" }
dg_xch_serialize = { path = "../serialize" }
dg_xch_servers = { path = "../servers" }
directories = "6.0.0"
futures-util = "0.3.32"
hex = "0.4.3"
log = "0.4.29"
prometheus = "0.14.0"
once_cell = "1.21.3"
rand = "0.10.3"
rayon = "1.11.0"
rustls = "0.23.46"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = { package = "serde_norway", version = "0.9.42" }
tempfile = "3"
time = "0.3.47"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "signal", "macros", "time", "fs", "process", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.29.0", features = ["v4"] }
zeroize = "1.9.1"
