[package]
name = "dg_xch_p2p"
description = "Peer and connection management for a Chia full node: sessions, address manager, supervised reconnection"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.89"
dg_xch_core = { path = "../core", version = "3.0.0", default-features = false }
dg_xch_clients = { path = "../clients", version = "3.0.0" }
dg_xch_serialize = { path = "../serialize", version = "3.0.0" }
log = "0.4.29"
rand = "0.10.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls", "rustls-tls-webpki-roots"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
dg_xch_servers = { path = "../servers", version = "3.0.0" }
rustls = { version = "0.23.46", features = ["ring"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "test-util"] }
