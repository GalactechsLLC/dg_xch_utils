[package]
name = "dg_xch_gui"
description = "Native Galactechs node, wallets, plotting and farming desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
falcon = ["dg_xch_core/falcon", "dg_xch_farmer/falcon", "dg_xch_wallet/falcon"]
labrador = ["falcon", "dg_xch_core/labrador", "dg_xch_farmer/labrador", "dg_xch_wallet/labrador"]
cuda = ["dg_xch_farmer/cuda"]

[dependencies]
bip39 = { version = "3.0.0", features = ["rand"] }
blst = "0.3.16"
dg_xch_clients = { path = "../clients" }
dg_xch_core = { path = "../core", default-features = false, features = ["bls"] }
dg_xch_farmer = { path = "../farmer", features = ["vulkan"] }
dg_xch_puzzles = { path = "../puzzles" }
dg_xch_keys = { path = "../keys" }
dg_xch_plotter = { path = "../plotter", features = ["vulkan"] }
dg_xch_pos2 = { path = "../proof_of_space/pos2", features = ["vulkan"] }
dg_xch_servers = { path = "../servers" }
dg_xch_wallet = { path = "../wallet" }
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "wayland", "x11"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
time = "0.3.47"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
zeroize = "1.9.1"
