[package]
name = "dg_xch_dev_tools"
version = "3.0.0"
edition = "2024"
authors = ["James Hoerr"]
description = "Developer diagnostics for the dg_xch full node: block fetching, corpus import, leak probing, live-node websocket validation, weight-proof building"
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.60", features = ["derive", "env"] }
dg_xch_clients = { path = "../../clients", version = "3.0.0" }
dg_xch_core = { path = "../../core", version = "3.0.0", default-features = false, features = ["bls"] }
dg_xch_node = { path = "../../node", version = "3.0.0" }
full-node = { path = "../../full-node", version = "3.0.0" }
dg_xch_p2p = { path = "../../p2p", version = "3.0.0" }
dg_xch_serialize = { path = "../../serialize", version = "3.0.0" }
dg_xch_stores = { path = "../../stores", version = "3.0.0" }
dg_xch_weight_proof = { path = "../../weight-proof", version = "3.0.0" }
rustls = { version = "0.23.37", features = ["ring"] }
uuid = { version = "1.21.0", features = ["v4"] }
zstd = "0.13.2"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "sync", "signal", "macros", "time", "net"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
tikv-jemallocator = "0.6"

[[bin]]
name = "leak_probe"
path = "src/bin/leak_probe.rs"
required-features = ["postgres"]

[features]
default = ["sqlite"]
sqlite = ["full-node/sqlite"]
postgres = ["dg_xch_stores/postgres", "full-node/postgres"]
mmap = ["dg_xch_stores/mmap", "full-node/mmap"]
