[package]
name = "dg_xch_dev_tools"
version = "3.0.0"
edition = "2024"
authors = ["James Hoerr"]
description = "Developer diagnostics for dg_xch: node inspection, corpus management, weight-proof and coin-root tooling"
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.60", features = ["derive", "env"] }
dg_xch_clients = { path = "../clients", version = "3.0.0" }
dg_xch_core = { path = "../core", version = "3.0.0", default-features = false, features = ["bls", "sqlite", "postgres"] }
dg_xch_node = { path = "../node", version = "3.0.0" }
dg_full_node = { path = "../full-node", version = "3.0.0" }
dg_xch_p2p = { path = "../p2p", version = "3.0.0" }
dg_xch_serialize = { path = "../serialize", version = "3.0.0" }
dg_xch_stores = { path = "../stores", version = "3.0.0" }
dg_xch_weight_proof = { path = "../weight-proof", version = "3.0.0" }
rustls = { version = "0.23.37", features = ["ring"] }
uuid = { version = "1.21.0", features = ["v4"] }
zstd = "0.13.2"
sha2 = "0.10.9"
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "postgres"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
futures-util = "0.3.32"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "sync", "signal", "macros", "time", "net"] }

[dev-dependencies]
dg_xch_stores = { path = "../stores", version = "3.0.0", features = ["mmap"] }
tempfile = "3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
tikv-jemallocator = "0.6"

[[bin]]
name = "leak_probe"
path = "src/bin/leak_probe.rs"
required-features = ["postgres"]

[features]
default = ["sqlite"]
sqlite = ["dg_full_node/sqlite"]
postgres = ["dg_xch_stores/postgres", "dg_full_node/postgres"]
mmap = ["dg_xch_stores/mmap", "dg_full_node/mmap"]
