[package]
name = "dg_xch_dev_tools"
version = "3.0.0"
edition = "2024"
authors = ["James Hoerr"]
description = "Developer diagnostics for dg_xch: node inspection, corpus management, weight-proof and coin-root tooling"
license = "Apache-2.0"
homepage = "https://github.com/GalactechsLLC/dg_xch_utils"
repository = "https://github.com/GalactechsLLC/dg_xch_utils"

[dependencies]
blst = "0.3.16"
dg_xch_farmer = { path = "../farmer" }
dg_xch_keys = { path = "../keys" }
dg_xch_plotter = { path = "../plotter" }
dg_xch_pos2 = { path = "../proof_of_space/pos2" }
dg_xch_puzzles = { path = "../puzzles" }
dg_xch_pool = { path = "../pool" }
dg_xch_wallet = { path = "../wallet" }
dg_xch_servers = { path = "../servers" }
hex = "0.4.3"
rand = "0.10.3"
serde_yaml = { package = "serde_norway", version = "0.9.42" }
zeroize = "1.9.1"
async-trait = "0.1.89"
clap = { version = "4.5.60", features = ["derive", "env"] }
dg_xch_clients = { path = "../clients", version = "3.0.0" }
dg_xch_core = { path = "../core", version = "3.0.0", default-features = false, features = ["bls", "sqlite", "postgres"] }
dg_xch_node = { path = "../node", version = "3.0.0" }
dg_full_node = { path = "../full-node", version = "3.0.0" }
dg_xch_p2p = { path = "../p2p", version = "3.0.0" }
dg_xch_serialize = { path = "../serialize", version = "3.0.0" }
dg_xch_stores = { path = "../stores", version = "3.0.0" }
dg_xch_weight_proof = { path = "../weight-proof", version = "3.0.0" }
rustls = { version = "0.23.46", features = ["ring"] }
uuid = { version = "1.29.0", features = ["v4"] }
zstd = "0.14.3"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "postgres"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
futures-util = "0.3.32"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "signal", "macros", "time", "net"] }

[dev-dependencies]
dg_xch_stores = { path = "../stores", version = "3.0.0", features = ["mmap"] }
tempfile = "3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[features]
falcon = ["dg_xch_core/falcon", "dg_xch_farmer/falcon", "dg_full_node/falcon", "dg_xch_wallet/falcon"]
labrador = ["falcon", "dg_xch_core/labrador", "dg_full_node/labrador", "dg_xch_wallet/labrador"]
cuda = ["dg_xch_farmer/cuda"]
vulkan = ["dg_xch_farmer/vulkan", "dg_xch_plotter/vulkan"]
default = ["sqlite"]
sqlite = ["dg_full_node/sqlite"]
postgres = ["dg_xch_stores/postgres", "dg_full_node/postgres"]
mmap = ["dg_xch_stores/mmap", "dg_full_node/mmap"]
