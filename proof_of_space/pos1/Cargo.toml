[package]
name = "dg_xch_pos1"
description = "Chia proof of space v1 plotting, reading and verification"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
cuda = ["dep:cudarc", "gpu"]
vulkan = ["dep:ash", "gpu"]
gpu = ["dep:bytemuck"]

[dependencies]
ash = { version = "0.38", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "cuda-12060", "dynamic-loading"], optional = true }
async-trait = "0.1.89"
blake3 = { workspace = true }
dg_xch_core = { workspace = true }
dg_xch_pos_common = { path = "../pos_common", version = "3.0.0" }
futures-util = "0.3.32"
hex = "0.4.3"
lazy_static = "1.5.1"
libc = "0.2.191"
log = "0.4.29"
num-traits = "0.2.19"
once_cell = "1.21.3"
parking_lot = "0.13.0"
rand = "0.10.3"
rayon = "1.11.0"
rustc-hash = "2.1.1"
time = "0.3.47"
tokio = {version = "1.54.1", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net", "io-util"]}
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
blst = "0.3.16"
dg_xch_core = { workspace = true, features = ["bls"] }
dg_xch_keys = { path = "../../keys", version = "3.0.0" }
serde_json = "1.0.154"
criterion = { version = "0.8.2", features = ["async_tokio"] }
dg_logger = { path = "../../logging", version = "3.0.0" }

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "verification"
harness = false
