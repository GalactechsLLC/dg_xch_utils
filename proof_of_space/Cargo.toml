[package]
name = "dg_xch_pos"
description = "Proof of Space library for the Chia Blockchain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.89"
aes = { version = "0.8.4", features = ["hazmat"] }
blake3 = "1.8.3"
dg_xch_core = {path = "../core", version="3.0.0", default-features = false }
futures-util = "0.3.32"
hex = "0.4.3"
lazy_static = "1.5.0"
libc = "0.2.174"
log = "0.4.29"
num-traits = "0.2.19"
once_cell = "1.21.3"
parking_lot = "0.12.5"
rand = "0.10.0"
rayon = "1.11.0"
rustc-hash = "2.1.1"
time = "0.3.47"
tokio = {version = "1.50.0", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net", "io-util"]}
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["async_tokio"] }
dg_logger = { path = "../logging", version = "3.0.0" }

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "verification"
harness = false
