[package]
name = "dg_xch_wallet"
description = "Native wallet accounts, synchronization and signing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
async-trait = "0.1.89"
bech32 = "0.12.0"
blst = { version = "0.3.16", features = ["portable"] }
chacha20poly1305 = "0.11.0"
dashmap = "6.1.0"
dg_xch_clients = { path = "../clients" }
dg_xch_core = { path = "../core", default-features = false, features = ["bls"] }
dg_xch_keys = { path = "../keys" }
dg_xch_node = { path = "../node", features = ["hint"] }
dg_xch_puzzles = { path = "../puzzles" }
dg_xch_serialize = { path = "../serialize" }
dg_xch_stores = { path = "../stores", features = ["hint"] }
flate2 = { version = "1", features = ["zlib-ng-compat"] }
hex = "0.4.3"
log = "0.4.29"
num-traits = "0.2.19"
rand = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[features]
falcon = ["dg_xch_core/falcon", "dg_xch_node/falcon"]
labrador = ["falcon", "dg_xch_core/labrador", "dg_xch_node/labrador"]

[dev-dependencies]
dg_xch_simulator = { path = "../simulator", default-features = false, features = ["pos2"] }
