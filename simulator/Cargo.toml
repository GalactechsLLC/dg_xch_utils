[package]
name = "dg_xch_simulator"
description = "Tunable consensus simulator for deterministic block production and parameter sweeps"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"
name = "dg_xch_simulator_lib"

[[bin]]
path = "src/main.rs"
name = "dg_xch_simulator"

# A drop-in simulated full node a wallet dials: farms a coin to `--reward-ph` and serves the peer/
# wallet protocol, sealing submitted transactions into blocks.
[[bin]]
path = "src/bin/sim_node.rs"
name = "sim_node"
required-features = ["server"]

[dependencies]
dg_xch_core = { path = "../core", version = "3.0.0", default-features = false, features = ["bls"] }
dg_xch_keys = { path = "../keys", version = "3.0.0" }
dg_xch_node = { path = "../node", version = "3.0.0" }
# The full-node server, reused (behind the `server` feature) to serve the peer/wallet protocol from
# the simulator's own store — a wallet syncs against the sim as if it were a mainnet node. `hint`
# pulls the coin-index + hint secondary indexes a wallet needs to discover coins and CAT/NFT assets.
dg_full_node = { path = "../full-node", features = ["hint"], optional = true }
rustls = { version = "0.23", optional = true }
num-bigint = { version = "0.4.6", optional = true }
async-trait = { version = "0.1.89", optional = true }
dg_xch_pos = { path = "../proof_of_space", version = "3.0.0" }
dg_xch_serialize = { path = "../serialize", version = "3.0.0" }
dg_xch_stores = { path = "../stores", version = "3.0.0" }
dg_xch_vdf = { path = "../vdf", version = "3.0.0" }
dg_logger = { path="../logging", version="3.0.0" }
blake3 = "1.8.3"
# Temporary external proof-of-space 2 implementation.
chia-pos2 = { version = "0.6.0", optional = true }
blst = { version = "0.3.16", features = ["portable"] }
log = "0.4.29"
portfu = { git = "https://github.com/GalactechsLLC/portfu.git", rev = "8cebf34added647488756b15fbeae3c608ab75f5", default-features = false, features = ["tasks", "tls"] }
rand_chacha = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
# zstd-sys and chia-pos2 each vendor a copy of FSE, and the two define the same symbols. Linking
# zstd against the system library keeps only one of them in the final binary.
zstd = { version = "0.13.2", features = ["pkg-config"], optional = true }
tokio = {version = "1.50.0", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}

[dev-dependencies]
async-trait = "0.1.89"
tempfile = "3"
num-bigint = "0.4.6"
serde_json = "1.0.145"

[features]
default = ["pos2"]
# Plot creation, proving, and solving for proof of space 2.
#
# It also pins zstd to the system library, because chia-pos2 and zstd-sys each vendor a copy of FSE
# and both define its symbols; a binary linking the two fails on a duplicate symbol unless one of
# them comes from elsewhere. The Docker image builds `dg` without this crate in its graph and keeps
# bundled zstd. A workspace-wide build that includes simulator binaries requires system zstd.
pos2 = ["dep:chia-pos2", "dep:zstd"]
# Serve the peer/wallet protocol from the simulator's chain so a real wallet can sync against it.
server = [
    "pos2",
    "dep:dg_full_node",
    "dep:rustls",
    "dep:num-bigint",
    "dep:async-trait",
]
