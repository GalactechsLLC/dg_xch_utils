[package]
name = "dg_xch_pool"
description = "Reference pool service and durable payout accounting"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
labrador = ["falcon", "dg_xch_core/labrador", "dg_xch_wallet/labrador"]
falcon = ["dg_xch_core/falcon", "dg_xch_wallet/falcon"]

[dependencies]
async-trait = "0.1.89"
blst = { version = "0.3.16", features = ["portable"] }
dg_xch_clients = { path = "../clients" }
dg_xch_core = { path = "../core", default-features = false, features = ["bls"] }
dg_xch_keys = { path = "../keys" }
dg_xch_pos = { path = "../proof_of_space" }
dg_xch_puzzles = { path = "../puzzles" }
dg_xch_servers = { path = "../servers" }
dg_xch_serialize = { path = "../serialize" }
dg_xch_wallet = { path = "../wallet" }
hex = "0.4.3"
libc = "0.2.191"
log = "0.4.29"
zeroize = "1.9.1"
portfu = { git = "https://github.com/GalactechsLLC/portfu.git", rev = "8cebf34added647488756b15fbeae3c608ab75f5", default-features = false, features = ["endpoint", "tasks", "tls"] }
rand = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
