[package]
name = "dg_xch_servers"
description = "Server support for Chia-compatible peer WebSocket protocols"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.89"
blst = { version = "0.3.16", features = ["portable"] }
dg_xch_core = {path = "../core", version = "3.0.0", default-features = false, features = ["bls"] }
dg_xch_clients = {path = "../clients", version = "3.0.0" }
dg_xch_keys = {path = "../keys", version = "3.0.0" }
dg_xch_pos = {path = "../proof_of_space", version = "3.0.0" }
dg_xch_serialize = {path = "../serialize", version = "3.0.0" }
http-body-util = { version = "0.1.3"}
http = "1.3.1"
hyper = {version="1.7.0", features=["full"]}
hyper-tungstenite = "0.19.0"
hyper-util = {version="0.1.17", features=["full"]}
log = "0.4.29"
prometheus = {version="0.14.0", features=["protobuf"], optional = true}
rustls = {version = "0.23.37" }
tokio = {version = "1.50.0", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}
tokio-rustls = { version = "0.26.4" }
tokio-tungstenite = {version = "0.28.0", features = ["rustls", "rustls-tls-webpki-roots"] }
uuid = {version="1.21.0", features=["v4"]}

[features]
metrics = ["dep:prometheus", "dg_xch_core/metrics", "dg_xch_clients/metrics"]
default = []
