[package]
name = "dg_xch_servers"
description = "Server support for Chia-compatible peer WebSocket protocols"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
directories = "6.0.0"
async-trait = "0.1.89"
blst = { version = "0.3.16", features = ["portable"] }
dg_xch_core = {path = "../core", version = "3.0.0", default-features = false, features = ["bls"] }
dg_xch_clients = {path = "../clients", version = "3.0.0" }
dg_xch_keys = {path = "../keys", version = "3.0.0" }
dg_xch_pos = {path = "../proof_of_space", version = "3.0.0" }
dg_xch_serialize = {path = "../serialize", version = "3.0.0" }
http-body-util = { version = "0.1.3"}
http = "1.3.1"
hyper = {version="1.12.0", features=["full"]}
hyper-tungstenite = "0.30.0"
hyper-util = {version="0.1.21", features=["full"]}
log = "0.4.29"
prometheus = {version="0.14.0", features=["protobuf"]}
portfu = { git = "https://github.com/GalactechsLLC/portfu.git", rev = "8cebf34added647488756b15fbeae3c608ab75f5", default-features = false }
rustls = {version = "0.23.46" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
tokio = {version = "1.54.1", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}
tokio-rustls = { version = "0.26.6" }
tokio-tungstenite = {version = "0.30.0", features = ["rustls", "rustls-tls-webpki-roots"] }
uuid = {version="1.29.0", features=["v4"]}

hex = { version = "0.4.3", optional = true }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "json", "uuid"] }

[features]
metrics = [ "dg_xch_core/metrics", "dg_xch_clients/metrics"]
discovery-postgres = ["dep:sqlx", "dep:hex"]
default = []
