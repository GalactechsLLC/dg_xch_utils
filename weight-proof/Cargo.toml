[package]
name = "dg_xch_weight_proof"
description = "Weight-proof validation: the verifying light client's trust anchor (consensus verification over core + vdf + proof-of-space)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

# A consensus-verification library that sits above core/vdf/pos: it turns a `WeightProof` (defined in
# dg_xch_core) into a verified claim about the heaviest chain. Kept out of dg_xch_core because wiring the
# VDF and proof-of-space verifiers from core would be a dependency cycle (vdf and pos both depend on core).
[dependencies]
log = "0.4"
dg_xch_core = { path = "../core", version = "3.0.0", default-features = false, features = ["bls"] }
dg_xch_vdf = { path = "../vdf", version = "3.0.0" }
dg_xch_pos = { path = "../proof_of_space", version = "3.0.0" }
dg_xch_serialize = { path = "../serialize", version = "3.0.0" }
# The serving half (serve.rs) builds proofs out of a node's BlockStore — the same query-shaped trait the
# server runs on, so a built proof is exactly what the p2p arm serves. tokio is `sync`-only: the whole-proof
# cache is an async single-flight, nothing else of the runtime.
dg_xch_stores = { path = "../stores", version = "3.0.0" }
tokio = { version = "1.50.0", features = ["sync"] }
# Sha512 supports deterministic MT19937 sampling.
sha2 = { version = "0.10.9", features = ["oid"] }
# BLS signature verification for the phase-5 recent-chain header validator (rc-sp / cc-sp / plot / pool /
# foliage signatures). Same pin/features as dg_xch_core; the Bytes48->PublicKey / Bytes96->Signature
# conversions and the AugScheme `verify_signature` glue live in dg_xch_core.
blst = { version = "0.3.16", features = ["portable"] }
# Phase-4 fans the independent sampled-segment VDF/PoSpace verifications across cores (the serial
# hotspot). rayon's global pool is core-count bounded, so parallelism is capped at the machine width.
# Same major as proof_of_space already pins (one resolved rayon in the lock).
rayon = "1.11"
# Fine-grained phase/segment timings so the logs alone show where the multi-minute verify goes.

[dev-dependencies]
hex = "0.4.3"
num-bigint = "0.4.6"
# serve.rs tests drive the async builder against an in-memory BlockStore double.
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1.89"
